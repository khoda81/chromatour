<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Chromatour finds satisfying perceptual orderings of colors in the browser."
    />
    <title>Chromatour</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">A tiny perceptual TSP lab</p>
        <h1>Chromatour</h1>
        <p class="lede">
          Arrange colors so neighboring colors feel like they belong together.
        </p>
      </header>

      <section class="panel" aria-label="Color tour search">
        <div class="controls">
          <div class="control">
            <label for="power">
              Objective power <output id="power-value" for="power">0.050</output>
            </label>
            <!-- Logarithmically mapped in JS from t ∈ [0, 1] to p ∈ [0.01, 1]. -->
            <input id="power" type="range" min="0" max="1" step="any" value="0.349485" />
          </div>

          <div class="control">
            <label for="color-count">
              Colors <output id="color-count-value" for="color-count">48</output>
            </label>
            <input id="color-count" type="range" min="8" max="256" step="1" value="48" />
          </div>

          <div class="control">
            <label for="solver">Solver</label>
            <select id="solver">
              <option value="ils-2opt">Iterated 2-opt</option>
              <option value="random-2opt">Random restart + 2-opt</option>
              <option value="greedy-2opt">Greedy starts + 2-opt</option>
            </select>
          </div>
        </div>

        <dl class="search-metrics">
          <div><dt>Search attempts</dt><dd id="iterations">0</dd></div>
          <div><dt>Top solutions</dt><dd id="elite-count">0/9</dd></div>
        </dl>
        <p id="status" class="status" role="status">Starting search…</p>

        <section class="history" aria-labelledby="history-title">
          <div class="history-heading">
            <div>
              <p class="history-kicker">Solver race</p>
              <h2 id="history-title">Best score over time</h2>
            </div>
            <p>Switch solvers to keep their traces on the same objective.</p>
          </div>
          <div id="history-plot" class="history-plot" aria-label="Solver convergence graph"></div>
        </section>

        <div id="solutions" class="solutions" aria-label="Best color orderings"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
