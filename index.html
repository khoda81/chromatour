<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Chromatour finds satisfying perceptual orderings of colors in the browser."
    />
    <title>Chromatour</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">A tiny perceptual TSP lab</p>
        <h1>Chromatour</h1>
        <p class="lede">
          Arrange colors so neighboring colors feel like they belong together.
        </p>
      </header>

      <section class="panel" aria-label="Color tour demo">
        <canvas id="palette" aria-label="Ordered color palette"></canvas>

        <div class="controls">
          <label for="power">
            Objective power <output id="power-value" for="power">2.00</output>
          </label>
          <input id="power" type="range" min="1" max="8" step="0.25" value="2" />

          <div class="buttons">
            <button id="randomize" type="button">Randomize</button>
            <button id="solve" class="primary" type="button">Solve</button>
          </div>
        </div>

        <dl class="metrics">
          <div><dt>Cost</dt><dd id="cost">—</dd></div>
          <div><dt>Worst edge</dt><dd id="worst">—</dd></div>
          <div><dt>Colors</dt><dd id="count">—</dd></div>
        </dl>
        <p id="status" class="status" role="status">Ready.</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
